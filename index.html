<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#061018" />
  <meta name="description" content="スマホ専用ミニゲーム集" />
  <title>MOBILE PLAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/hub.css" />
</head>
<body>
  <div id="hub">
    <header>
      <p class="eyebrow">ONE HAND · TOUCH ONLY</p>
      <h1>MOBILE<br />PLAY</h1>
      <p class="lead">スマホ向けミニゲーム集</p>
    </header>
    <nav class="cards" aria-label="games">
      <a class="card c1" href="games/tap-storm/">
        <span class="tag">ACTION</span>
        <h2>TAP STORM</h2>
        <p>膨張する玉を連打クリア</p>
      </a>
      <a class="card c2" href="games/dodge-drop/">
        <span class="tag">DODGE</span>
        <h2>DODGE DROP</h2>
        <p>左右タップで落下を回避</p>
      </a>
      <a class="card c3" href="games/color-snap/">
        <span class="tag">TIMING</span>
        <h2>COLOR SNAP</h2>
        <p>色が一致した瞬間にタップ</p>
      </a>
      <a class="card c4" href="games/flick-out/">
        <span class="tag">FLICK</span>
        <h2>FLICK OUT</h2>
        <p>迫る弾をフリックで払い出せ</p>
      </a>
      <a class="card c5" href="games/stack-pulse/">
        <span class="tag">STACK</span>
        <h2>STACK PULSE</h2>
        <p>タイミングでタワーを積み上げろ</p>
      </a>
    </nav>
    <footer>縦画面推奨 · 音は各ゲーム内でON</footer>
  </div>
</body>
</html>
