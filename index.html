<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#061018" />
  <meta name="description" content="スマホ専用スピードアクション集" />
  <title>MOBILE PLAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/hub.css" />
</head>
<body>
  <div id="hub">
    <header>
      <p class="eyebrow">ONE HAND · FINGER DESTROYER</p>
      <h1>MOBILE<br />PLAY</h1>
      <p class="lead">連打・圧・手応え。全部キツめ</p>
    </header>
    <nav class="cards" aria-label="games">
      <a class="card c1" href="games/tap-storm/">
        <span class="tag">CLASSIC</span>
        <h2>TAP STORM</h2>
        <p>膨張する玉を連打で潰せ</p>
      </a>
      <a class="card c2" href="games/swarm-smash/">
        <span class="tag">SWARM</span>
        <h2>SWARM SMASH</h2>
        <p>コアに殺到する群れを叩き潰せ</p>
      </a>
      <a class="card c3" href="games/risk-tap/">
        <span class="tag">RISK</span>
        <h2>RISK TAP</h2>
        <p>緑は押せ・赤は触るな。高速判断</p>
      </a>
      <a class="card c4" href="games/orbit-bash/">
        <span class="tag">ORBIT</span>
        <h2>ORBIT BASH</h2>
        <p>渦巻く隕石を連打粉砕</p>
      </a>
      <a class="card c5" href="games/boss-mash/">
        <span class="tag">RAID</span>
        <h2>BOSS MASH</h2>
        <p>ボス連打＋雑魚処理のサバイバル</p>
      </a>
    </nav>
    <footer>全部ハード · ベストスコア保存 · 縦画面</footer>
  </div>
</body>
</html>
