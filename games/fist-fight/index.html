<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0a0a" />
  <title>FIST FIGHT</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shell.css" />
  <style>
    #app { background: radial-gradient(ellipse at 50% 40%, #402020 0%, #120808 60%); }
    .eye, h2.result { color: #ff6a4a; }
    .cta { color: #1a0800; background: linear-gradient(135deg, #ffb090, #ff6040); }
    #battle-ui {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 8;
      padding: 12px 14px calc(18px + env(safe-area-inset-bottom, 0px));
      display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 10px; pointer-events: all;
    }
    #battle-ui button {
      border: 0; border-radius: 14px; min-height: 64px; font-family: Orbitron, sans-serif;
      font-weight: 800; font-size: 14px; letter-spacing: 0.08em; color: #fff; cursor: pointer;
    }
    #btn-block { background: #2a3848; }
    #btn-punch { background: linear-gradient(180deg, #ff8060, #e03020); font-size: 18px; }
    #btn-special { background: linear-gradient(180deg, #ffd060, #e09020); color: #201000; }
    #btn-special:disabled, #btn-punch:disabled, #btn-block:disabled { opacity: 0.4; }
    .hp-wrap { position: absolute; left: 14px; right: 14px; top: calc(14px + env(safe-area-inset-top,0px)); z-index: 6; pointer-events: none; }
    .hp-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 12px; letter-spacing: 0.12em; }
    .bar { height: 12px; border-radius: 6px; background: #221418; overflow: hidden; border: 1px solid #4a3030; margin-bottom: 10px; }
    .bar > i { display: block; height: 100%; width: 100%; }
    #php { background: linear-gradient(90deg, #2a8a40, #50ff80); }
    #ehp { background: linear-gradient(90deg, #8a2020, #ff5050); }
    #msg { position: absolute; left: 0; right: 0; top: 42%; text-align: center; z-index: 7;
      font-family: Orbitron, sans-serif; font-size: 28px; font-weight: 800; opacity: 0; pointer-events: none;
      text-shadow: 0 0 12px rgba(0,0,0,.8); transition: opacity 0.15s; }
    #msg.show { opacity: 1; }
  </style>
</head>
<body>
  <a class="back" href="../../index.html">竊・荳隕ｧ</a>
  <div id="app">
    <canvas id="c"></canvas>
    <div id="hud" class="hidden">
      <div class="hp-wrap">
        <div class="hp-row"><span>YOU</span><span id="round">R1</span><span id="enemy-name">RIVAL</span></div>
        <div class="bar"><i id="php"></i></div>
        <div class="bar"><i id="ehp"></i></div>
      </div>
      <div id="msg"></div>
    </div>
    <div id="battle-ui" class="hidden">
      <button type="button" id="btn-block">BLOCK</button>
      <button type="button" id="btn-punch">PUNCH</button>
      <button type="button" id="btn-special">SP</button>
    </div>
    <div id="title" class="screen">
      <p class="eye">1v1 BATTLE</p>
      <h1>FIST<br />FIGHT</h1>
      <p class="lead">繝代Φ繝√・繧ｬ繝ｼ繝峨・蠢・ｮｺ縺ｧAI縺ｨ蟇ｾ豎ｺ</p>
      <button id="start" class="cta">FIGHT</button>
    </div>
    <div id="result" class="screen hidden">
      <p class="eye" id="result-eye">WIN</p>
      <h2 class="result" id="rs">0</h2>
      <p class="lead" id="result-sub">wins</p>
      <button id="again" class="cta">REMATCH</button>
      <button id="home" class="cta ghost">TITLE</button>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
