<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#071018" />
  <meta name="description" content="繧ｹ繝槭・蟆ら畑繧ｿ繝・・繧｢繧ｯ繧ｷ繝ｧ繝ｳ 窶・TAP STORM" />
  <title>TAP STORM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="back" href="../../index.html">竊・荳隕ｧ</a>
  <div id="app">
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="stat">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="stat center">
          <span class="label">WAVE</span>
          <span class="value" id="wave">1</span>
        </div>
        <div class="stat right">
          <span class="label">BEST</span>
          <span class="value" id="best">0</span>
        </div>
      </div>
      <div class="combo-wrap">
        <div id="combo" class="combo">ﾃ・</div>
      </div>
      <div class="lives" id="lives" aria-label="lives"></div>
    </div>

    <div id="title-screen" class="screen">
      <div class="bg-glow"></div>
      <p class="eyebrow">MOBILE TAP ACTION</p>
      <h1 class="brand">TAP<br />STORM</h1>
      <p class="lead">蜈峨ｋ邇峨ｒ繧ｿ繝・・縺励※逕溘″谿九ｌ</p>
      <button type="button" id="btn-start" class="cta">PLAY</button>
      <p class="hint">迚・焔繝ｻ邵ｦ逕ｻ髱｢繝ｻ髻ｳ繧ｪ繝ｳ謗ｨ螂ｨ</p>
    </div>

    <div id="result-screen" class="screen hidden">
      <p class="eyebrow" id="result-eyebrow">GAME OVER</p>
      <h2 class="result-title" id="result-title">0</h2>
      <p class="lead" id="result-sub">SCORE</p>
      <div class="result-meta">
        <div><span class="label">WAVE</span><span id="result-wave">1</span></div>
        <div><span class="label">MAX COMBO</span><span id="result-combo">1</span></div>
      </div>
      <button type="button" id="btn-again" class="cta">AGAIN</button>
      <button type="button" id="btn-home" class="cta ghost">TITLE</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
