<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#140818" />
  <title>BOSS MASH</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../shared/shell.css" />
  <style>
    #app { background: radial-gradient(ellipse at 50% 30%, #401050 0%, #140818 55%); }
    .eye, .hud-top .mid b, h2.result { color: #e060ff; }
    .cta { color: #140818; background: linear-gradient(135deg, #f0a0ff, #c040ff); }
    .lives i { background: #e060ff; box-shadow: 0 0 10px rgba(200,80,255,.5); }
    #bossbar {
      position: absolute; left: 16px; right: 16px; top: calc(78px + env(safe-area-inset-top,0px));
      height: 12px; border-radius: 6px; background: #221028; border: 1px solid #603070; overflow: hidden;
      pointer-events: none; z-index: 6;
    }
    #bossbar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg,#ff60c0,#e060ff,#a040ff);
      transition: width 0.08s; }
    #bossname {
      position: absolute; left: 0; right: 0; top: calc(58px + env(safe-area-inset-top,0px));
      text-align: center; font-family: Orbitron,sans-serif; font-size: 12px; letter-spacing: .14em;
      color: #e8b0ff; pointer-events: none; z-index: 6;
    }
  </style>
</head>
<body>
  <a class="back" href="../../">← 一覧</a>
  <div id="app">
    <canvas id="c"></canvas>
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div><span class="l">SCORE</span><b id="score">0</b></div>
        <div class="mid"><span class="l">STAGE</span><b id="wave">1</b></div>
        <div class="right"><span class="l">BEST</span><b id="best">0</b></div>
      </div>
      <div id="combo" class="combo">×1</div>
      <div id="lives" class="lives"></div>
    </div>
    <div id="bossname" class="hidden">BOSS</div>
    <div id="bossbar" class="hidden"><i id="bhp"></i></div>
    <div id="title" class="screen">
      <p class="eye">RAID ACTION</p>
      <h1>BOSS<br />MASH</h1>
      <p class="lead">ボスを連打しつつ小物も潰せ — 火力が加速する</p>
      <button id="start" class="cta">PLAY</button>
    </div>
    <div id="result" class="screen hidden">
      <p class="eye">DEFEATED</p>
      <h2 class="result" id="rs">0</h2>
      <button id="again" class="cta">AGAIN</button>
      <button id="home" class="cta ghost">TITLE</button>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
