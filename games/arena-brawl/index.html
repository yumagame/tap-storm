<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1018" />
  <title>ARENA BRAWL</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shell.css" />
  <style>
    #app { background: radial-gradient(ellipse at 50% 50%, #1a2838 0%, #0a1018 60%); }
    .eye, h2.result, .hud-top .mid b { color: #60d0ff; }
    .cta { color: #041018; background: linear-gradient(135deg, #90e0ff, #30a0ff); }
    .hint-f {
      position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom,0px));
      text-align: center; z-index: 6; pointer-events: none; color: #6a90a8; font-size: 13px;
    }
  </style>
</head>
<body>
  <a class="back" href="../../index.html">ↁE一覧</a>
  <div id="app">
    <canvas id="c"></canvas>
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div><span class="l">KILLS</span><b id="score">0</b></div>
        <div class="mid"><span class="l">WAVE</span><b id="wave">1</b></div>
        <div class="right"><span class="l">BEST</span><b id="best">0</b></div>
      </div>
      <div id="combo" class="combo">ÁE</div>
      <div id="lives" class="lives"></div>
      <div class="hint-f">画面をタチE�Eして移勁E/ 敵に触れて攻撁E/div>
    </div>
    <div id="title" class="screen">
      <p class="eye">ARENA SURVIVAL</p>
      <h1>ARENA<br />BRAWL</h1>
      <p class="lead">タチE�Eで移動し敵に突っ込んで倒すバトルロイヤル型戦闁E/p>
      <button id="start" class="cta">ENTER</button>
    </div>
    <div id="result" class="screen hidden">
      <p class="eye">ELIMINATED</p>
      <h2 class="result" id="rs">0</h2>
      <button id="again" class="cta">RETRY</button>
      <button id="home" class="cta ghost">TITLE</button>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
