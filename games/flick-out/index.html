<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#180814" />
  <title>FLICK OUT</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="back" href="../../">← 一覧</a>
  <div id="app">
    <canvas id="c"></canvas>
    <div id="hud" class="hidden">
      <div><span class="l">SCORE</span><b id="score">0</b></div>
      <div class="right"><span class="l">BEST</span><b id="best">0</b></div>
    </div>
    <div id="title" class="screen">
      <p class="eye">SWIPE DEFENSE</p>
      <h1>FLICK<br />OUT</h1>
      <p class="lead">中心に迫る弾をフリックで払え</p>
      <button id="start" class="cta">PLAY</button>
    </div>
    <div id="result" class="screen hidden">
      <p class="eye">CORE HIT</p>
      <h2 id="rs">0</h2>
      <button id="again" class="cta">AGAIN</button>
      <button id="home" class="cta ghost">TITLE</button>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
