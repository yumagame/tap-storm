<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#081420" />
  <title>COLOR SNAP</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="back" href="../../">← 一覧</a>
  <div id="app">
    <div id="field">
      <div id="target-color"></div>
      <p class="hint-label">GOAL</p>
      <div id="orb"></div>
      <p id="msg">色が一致したらタップ！</p>
    </div>
    <div id="hud" class="hidden">
      <div><span class="l">SCORE</span><b id="score">0</b></div>
      <div><span class="l">STREAK</span><b id="streak">0</b></div>
      <div><span class="l">BEST</span><b id="best">0</b></div>
    </div>
    <div id="title" class="screen">
      <p class="eye">TIMING TAP</p>
      <h1>COLOR<br />SNAP</h1>
      <p class="lead">変わるむ色とGOALが揃った瞬間にタップ</p>
      <button id="start" class="cta">PLAY</button>
    </div>
    <div id="result" class="screen hidden">
      <p class="eye">TIME UP</p>
      <h2 id="rs">0</h2>
      <button id="again" class="cta">AGAIN</button>
      <button id="home" class="cta ghost">TITLE</button>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
