<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12081a" />
  <title>SKILL RAID</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../shared/shell.css" />
  <style>
    #app { background: radial-gradient(ellipse at 50% 30%, #301848 0%, #12081a 55%); }
    .eye, h2.result { color: #d070ff; }
    .cta { color: #140818; background: linear-gradient(135deg, #f0b0ff, #c050ff); }
    #skills {
      position: absolute; left: 10px; right: 10px; bottom: calc(12px + env(safe-area-inset-bottom,0px));
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; z-index: 8; pointer-events: all;
    }
    #skills button {
      position: relative; overflow: hidden; border: 1.5px solid #604080; border-radius: 12px;
      min-height: 70px; background: rgba(20,10,28,.92); color: #f0e0ff;
      font-family: Orbitron, sans-serif; font-weight: 800; font-size: 12px; cursor: pointer;
    }
    #skills button .cd {
      position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
      background: rgba(0,0,0,0.55); pointer-events: none;
    }
    #skills button:disabled { opacity: 0.45; }
    #boss-wrap {
      position: absolute; left: 14px; right: 14px; top: calc(12px + env(safe-area-inset-top,0px));
      z-index: 6; pointer-events: none;
    }
    #boss-wrap .name { font-family: Orbitron,sans-serif; font-size: 12px; letter-spacing: .14em; color: #e0b0ff; margin-bottom: 4px; }
    #boss-wrap .bar { height: 12px; border-radius: 6px; background: #221028; border: 1px solid #503060; overflow: hidden; }
    #boss-wrap .bar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg,#ff70c0,#c050ff); }
    #log {
      position: absolute; left: 0; right: 0; top: 38%; text-align: center; z-index: 7;
      font-family: Orbitron,sans-serif; font-size: 22px; font-weight: 800; opacity: 0; pointer-events: none;
      transition: opacity .12s; text-shadow: 0 0 12px #000;
    }
    #log.show { opacity: 1; }
  </style>
</head>
<body>
  <a class="back" href="../../">← 一覧</a>
  <div id="app">
    <canvas id="c"></canvas>
    <div id="hud" class="hidden">
      <div id="boss-wrap">
        <div class="name" id="bname">RAID BOSS</div>
        <div class="bar"><i id="bhp"></i></div>
        <div style="display:flex;justify-content:space-between;margin-top:8px;font-family:Orbitron,sans-serif;font-size:13px;">
          <span>HP <b id="php">100</b></span>
          <span>STAGE <b id="stage">1</b></span>
        </div>
      </div>
      <div id="log"></div>
      <div id="skills">
        <button type="button" data-s="slash">SLASH<span class="cd"></span></button>
        <button type="button" data-s="bash">BASH<span class="cd"></span></button>
        <button type="button" data-s="heal">HEAL<span class="cd"></span></button>
        <button type="button" data-s="ult">ULT<span class="cd"></span></button>
      </div>
    </div>
    <div id="title" class="screen">
      <p class="eye">SKILL BATTLE</p>
      <h1>SKILL<br />RAID</h1>
      <p class="lead">スキルを切ってボスと戦うレイド風バトル</p>
      <button id="start" class="cta">RAID</button>
    </div>
    <div id="result" class="screen hidden">
      <p class="eye" id="result-eye">CLEAR</p>
      <h2 class="result" id="rs">1</h2>
      <button id="again" class="cta">NEXT</button>
      <button id="home" class="cta ghost">TITLE</button>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
