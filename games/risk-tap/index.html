<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#061410" />
  <title>RISK TAP</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../shared/shell.css" />
  <style>
    #app { background: radial-gradient(ellipse at 50% 20%, #143820 0%, #061410 55%); }
    .eye, .hud-top .mid b, h2.result { color: #3ee0a0; }
    .cta { color: #041410; background: linear-gradient(135deg, #7cffb0, #2ef080); }
  </style>
</head>
<body>
  <a class="back" href="../../">← 一覧</a>
  <div id="app">
    <canvas id="c"></canvas>
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div><span class="l">SCORE</span><b id="score">0</b></div>
        <div class="mid"><span class="l">WAVE</span><b id="wave">1</b></div>
        <div class="right"><span class="l">BEST</span><b id="best">0</b></div>
      </div>
      <div id="combo" class="combo">×1</div>
      <div id="lives" class="lives"></div>
    </div>
    <div id="title" class="screen">
      <p class="eye">GOOD ≠ BAD</p>
      <h1>RISK<br />TAP</h1>
      <p class="lead">緑・金は潰せ！　赤は触るな — 誤タップ即ダメージ</p>
      <button id="start" class="cta">PLAY</button>
    </div>
    <div id="result" class="screen hidden">
      <p class="eye">GAME OVER</p>
      <h2 class="result" id="rs">0</h2>
      <button id="again" class="cta">AGAIN</button>
      <button id="home" class="cta ghost">TITLE</button>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
